services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    volumes:
      - ${SCRIPT_DIR}:${SCRIPT_DIR}
      - ${OP_REPO_PATH}:${OP_REPO_PATH}
    environment:
      - ANTHROPIC_API_KEY
      - GITHUB_TOKEN
      - CLAUDE_URL=http://claude:3000
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GIT_COMMITTER_NAME
      - GIT_COMMITTER_EMAIL
      - OP_URL=${OP_URL}
      - TOKEN=${TOKEN}
      - OP_REPO_PATH
    working_dir: ${SCRIPT_DIR}
    stdin_open: true
    tty: true

  claude:
    build:
      context: .
      dockerfile: Dockerfile.claude
    volumes:
      - ${SCRIPT_DIR}/.chomper/claude-auth:/home/node/.claude
      - ${SCRIPT_DIR}/.chomper/openproject:/repo
      - ${SCRIPT_DIR}/.chomper:/state
    environment:
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      - FORCE_COLOR=1
      - GIT_DISCOVERY_ACROSS_FILESYSTEM=1
      - ANTHROPIC_API_KEY
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 15
