# Shared hardening for the sidecar containers (harness/authgw/proxy). The runner
# is the trusted orchestrator and deliberately not hardened this way.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    # SCRIPT_DIR is set (to an absolute path) by ./chomper, which mounts the repo
    # at its real host path so the paths the agent computes resolve identically
    # inside the container. When unset — e.g. a bare `docker compose run runner …`
    # for tests — it falls back to mounting the current project at a fixed path,
    # so no SCRIPT_DIR=… prefix is needed. Each repo's standalone clone lives under
    # .chomper/repos/<name>, covered by this single mount.
    # Run as the host user (exported by ./chomper) so files written into the
    # bind-mounted .chomper/ are owned by you, not root. Defaults to root when
    # unset, e.g. a bare `docker compose run runner …` for tests.
    user: "${CHOMPER_UID:-0}:${CHOMPER_GID:-0}"
    volumes:
      - ${SCRIPT_DIR:-.}:${SCRIPT_DIR:-/chomper}
    environment:
      # Non-root needs a writable HOME for bundler/git config scratch.
      - HOME=/tmp
      - GITHUB_CONTRIBUTOR_TOKEN=${GITHUB_CONTRIBUTOR_TOKEN:-}
      - HARNESS_URL=http://harness:47291
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GIT_COMMITTER_NAME
      - GIT_COMMITTER_EMAIL
      - OPENPROJECT_URL=${OPENPROJECT_URL}
      - OPENPROJECT_TOKEN=${OPENPROJECT_TOKEN}
      - CHOMPER_ALLOWED_OP_USER_IDS=${CHOMPER_ALLOWED_OP_USER_IDS:-}
      - CHOMPER_ALLOWED_GH_USERS=${CHOMPER_ALLOWED_GH_USERS:-}
      # The optional knobs, passed WITHOUT a default (`- VAR`, not
      # `- VAR=${VAR:-}`): Compose resolves the bare form from .env too, but an
      # explicit `${VAR:-}` would hand the container an empty string, and an
      # empty string beats the default in every `ENV.fetch(name, default)`
      # reader (Context, Harness). Unset must mean absent, not blank.
      - CHOMPER_MODEL
      - CHOMPER_TRIAGE_MODEL
      - CHOMPER_ASSIGN_TRIGGER
      - CHOMPER_CI_MAX_ATTEMPTS
      - CHOMPER_CI_IGNORE_CHECKS
      - CHOMPER_TRACK_UPSTREAM_PRS
      - CHOMPER_PD_PARENT_TYPE
      - CHOMPER_PD_CHILD_TYPE
      - CHOMPER_PD_IMPLEMENTING_STATUS
      - CHOMPER_PD_IMPLEMENTED_STATUS
      # Optional: seeds the openproject clone from a local checkout (bin/repos).
      - OP_REPO_PATH
    working_dir: ${SCRIPT_DIR:-/chomper}
    stdin_open: true
    tty: true
    networks:
      - internal
      - egress

  # The harness container is deliberately not published on the host and sits on
  # an internal-only network: server.js is unauthenticated, so its only client
  # must be the runner. Model calls reach OpenRouter via authgw over the
  # internal network (NO_PROXY below); anything else goes through the egress
  # proxy, which allows only the hosts in tinyproxy-filter — work-package text
  # is untrusted, and this closes the exfiltration channel a prompt injection
  # would need.
  harness:
    build:
      context: .
      dockerfile: Dockerfile.harness
    depends_on:
      - proxy
    # Run as the host user (exported by ./chomper) so files pi writes into the
    # bind-mounted .chomper/pi-agent and .chomper/pi-sessions are owned by —
    # and persist for — you. The image's baked node user is uid 1000; on a
    # host whose user isn't 1000 that node uid can't write host-owned dirs, so
    # nothing would persist. Defaults to 1000 (the node user) when unset, e.g.
    # a bare `docker compose run`.
    user: "${CHOMPER_UID:-1000}:${CHOMPER_GID:-1000}"
    # Run the CLI in /repos (the parent of every repo's worktree) so pi sees
    # them all at /repos/<name>. --no-context-files (server.js) stops pi from
    # auto-loading a repo's CLAUDE.md/AGENTS.md on its own — the prompts tell
    # it to read each target repo's directly instead (see the --no-context-files
    # comment in server.js for why).
    working_dir: /repos
    volumes:
      # pi's config dir (settings.json/models.json seeded by server.js,
      # auth.json, model catalogs) — writable so first boot can seed it.
      - ${SCRIPT_DIR:-.}/.chomper/pi-agent:/pi-agent
      # Session transcripts, keyed by --session <id> — writable, and now on a
      # host mount so a session survives the container being recreated.
      - ${SCRIPT_DIR:-.}/.chomper/pi-sessions:/sessions
      # Every repo's standalone clone, at /repos/<name>. pi reads/edits files
      # here and browses git history (read-only) — each clone carries its own .git.
      - ${SCRIPT_DIR:-.}/.chomper/repos:/repos
      # Read-only: pi only reads item/plan files from here; the runner is the
      # sole writer of .chomper state. Defense-in-depth beyond the write-guard.
      - ${SCRIPT_DIR:-.}/.chomper:/state:ro
    environment:
      - PI_CODING_AGENT_DIR=/pi-agent
      - PI_CODING_AGENT_SESSION_DIR=/sessions
      # When running as the host uid, /home/node (owned by the baked node user) and
      # an absent passwd entry would otherwise break os.homedir(); point HOME at the
      # tmpfs so stray cache writes land there. Config/sessions still persist via
      # the two mounts above, which are host-owned, writable bind mounts.
      - HOME=/tmp
      - FORCE_COLOR=1
      - GIT_DISCOVERY_ACROSS_FILESYSTEM=1
      # The real OpenRouter key never reaches this container: pi-models.json
      # routes the openrouter provider through authgw (which holds the real
      # key) and authenticates with this non-secret handshake token.
      - CHOMPER_GW_TOKEN=${CHOMPER_GW_TOKEN:-}
      - PI_OFFLINE=1
      - HTTP_PROXY=http://proxy:8888
      - HTTPS_PROXY=http://proxy:8888
      # authgw is reached directly over the internal network, not via tinyproxy.
      - NO_PROXY=localhost,127.0.0.1,authgw
    networks:
      - internal
    <<: *hardened
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:47291/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Auth gateway — holds the real OPENROUTER_API_KEY and injects it as the
  # Authorization bearer token on requests forwarded to openrouter.ai. pi's
  # models.json override (pi-models.json) points the openrouter provider's
  # baseUrl here and authenticates with the fixed gateway token, so the real
  # key never lives alongside untrusted work-package content. Always forwards
  # to a hardcoded host, so it is not an open proxy.
  authgw:
    build:
      context: .
      dockerfile: Dockerfile.authgw
    environment:
      - OPENROUTER_API_KEY
      # Fixed handshake value (not a secret); must match the value
      # pi-models.json resolves $CHOMPER_GW_TOKEN to in the harness container.
      # chomper exports this (the single source for the value).
      - CHOMPER_GW_TOKEN
    networks:
      - internal
      - egress
    <<: *hardened
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:47292/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Egress allowlist proxy for the harness container (tinyproxy, CONNECT to
  # the hosts in tinyproxy-filter only — model calls bypass it entirely,
  # reaching authgw directly over the internal network).
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    networks:
      - internal
      - egress
    <<: *hardened

networks:
  # No route to the outside world — harness can only talk to runner and proxy.
  internal:
    internal: true
  egress:
