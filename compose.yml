# Shared hardening for the sidecar containers (claude/authgw/proxy). The runner
# is the trusted orchestrator and deliberately not hardened this way.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    # SCRIPT_DIR is set (to an absolute path) by ./chomper, which mounts the repo
    # at its real host path so the paths the agent computes resolve identically
    # inside the container. When unset — e.g. a bare `docker compose run runner …`
    # for tests — it falls back to mounting the current project at a fixed path,
    # so no SCRIPT_DIR=… prefix is needed. Each repo's standalone clone lives under
    # .chomper/repos/<name>, covered by this single mount.
    # Run as the host user (exported by ./chomper) so files written into the
    # bind-mounted .chomper/ are owned by you, not root. Defaults to root when
    # unset, e.g. a bare `docker compose run runner …` for tests.
    user: "${CHOMPER_UID:-0}:${CHOMPER_GID:-0}"
    volumes:
      - ${SCRIPT_DIR:-.}:${SCRIPT_DIR:-/chomper}
    environment:
      # Non-root needs a writable HOME for bundler/git config scratch.
      - HOME=/tmp
      - GITHUB_CONTRIBUTOR_TOKEN=${GITHUB_CONTRIBUTOR_TOKEN:-}
      - CLAUDE_URL=http://claude:47291
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GIT_COMMITTER_NAME
      - GIT_COMMITTER_EMAIL
      - OPENPROJECT_URL=${OPENPROJECT_URL}
      - OPENPROJECT_TOKEN=${OPENPROJECT_TOKEN}
      - CHOMPER_ALLOWED_OP_USER_IDS=${CHOMPER_ALLOWED_OP_USER_IDS:-}
      - CHOMPER_ALLOWED_GH_USERS=${CHOMPER_ALLOWED_GH_USERS:-}
      - CHOMPER_MODEL
      - CHOMPER_TRIAGE_MODEL
      - CHOMPER_ASSIGN_TRIGGER
      - CHOMPER_CI_MAX_ATTEMPTS
      - CHOMPER_CI_IGNORE_CHECKS
      # Optional: seeds the openproject clone from a local checkout (bin/repos).
      - OP_REPO_PATH
    working_dir: ${SCRIPT_DIR:-/chomper}
    stdin_open: true
    tty: true
    networks:
      - internal
      - egress

  # The claude container is deliberately not published on the host and sits on
  # an internal-only network: server.js is unauthenticated, so its only client
  # must be the runner. All outbound traffic goes through the egress proxy,
  # which allows Anthropic endpoints only — work-package text is untrusted, and
  # this closes the exfiltration channel a prompt injection would need.
  claude:
    build:
      context: .
      dockerfile: Dockerfile.claude
    depends_on:
      - proxy
    # Run as the host user (exported by ./chomper) so OAuth creds written into the
    # bind-mounted .chomper/claude-auth are owned by — and persist for — you. The
    # image's baked node user is uid 1000; on a host whose user isn't 1000 that
    # node uid can't write the host-owned auth dir, so auth wouldn't persist.
    # Defaults to 1000 (the node user) when unset, e.g. a bare `docker compose run`.
    user: "${CHOMPER_UID:-1000}:${CHOMPER_GID:-1000}"
    # Run the CLI in /repos (the parent of every repo's worktree) so Claude sees
    # them all at /repos/<name>; it still auto-loads /repos/openproject/CLAUDE.md
    # (OpenProject's AGENTS.md) as project memory when it reads files there.
    working_dir: /repos
    volumes:
      - ${SCRIPT_DIR:-.}/.chomper/claude-auth:/home/node/.claude
      # Every repo's standalone clone, at /repos/<name>. Claude reads/edits files
      # here and browses git history (read-only) — each clone carries its own .git.
      - ${SCRIPT_DIR:-.}/.chomper/repos:/repos
      # Read-only: claude only reads item/plan files from here; the runner is the
      # sole writer of .chomper state. Defense-in-depth beyond the write-guard hook.
      - ${SCRIPT_DIR:-.}/.chomper:/state:ro
    environment:
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      # When running as the host uid, /home/node (owned by the baked node user) and
      # an absent passwd entry would otherwise break os.homedir(); point HOME at the
      # tmpfs so stray ~/.cache writes land there. Creds still persist via
      # CLAUDE_CONFIG_DIR, which is the host-owned, writable bind mount.
      - HOME=/tmp
      - FORCE_COLOR=1
      - GIT_DISCOVERY_ACROSS_FILESYSTEM=1
      # API-key mode: chomper sets these to route through the authgw gateway
      # (which holds the real key); the container carries only a non-secret
      # handshake token. OAuth fallback (no API key): both stay empty, so the CLI
      # uses the stored login creds and reaches Anthropic via the proxy. The real
      # key never reaches this container in either mode.
      - ANTHROPIC_BASE_URL=${CHOMPER_CLAUDE_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${CHOMPER_GW_TOKEN:-}
      - HTTP_PROXY=http://proxy:8888
      - HTTPS_PROXY=http://proxy:8888
      # authgw is reached directly over the internal network, not via tinyproxy.
      - NO_PROXY=localhost,127.0.0.1,authgw
    networks:
      - internal
    <<: *hardened
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:47291/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Auth gateway — holds the real ANTHROPIC_API_KEY and injects it as x-api-key
  # on requests forwarded to api.anthropic.com. The claude container points
  # ANTHROPIC_BASE_URL here and authenticates with the fixed gateway token, so
  # the real key never lives alongside untrusted work-package content. Always
  # forwards to a hardcoded host, so it is not an open proxy.
  authgw:
    build:
      context: .
      dockerfile: Dockerfile.authgw
    environment:
      - ANTHROPIC_API_KEY
      # Fixed handshake value (not a secret); must match claude's
      # ANTHROPIC_AUTH_TOKEN. authgw only runs in API-key mode, where chomper
      # exports this (the single source for the value).
      - CHOMPER_GW_TOKEN
    networks:
      - internal
      - egress
    <<: *hardened
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:47292/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Egress allowlist proxy for the claude container (tinyproxy, CONNECT to
  # Anthropic domains only — see tinyproxy-filter).
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    networks:
      - internal
      - egress
    <<: *hardened

networks:
  # No route to the outside world — claude can only talk to runner and proxy.
  internal:
    internal: true
  egress:
