name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ruby:4.0-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends build-essential

      - name: Install gems
        run: bundle install

      - name: Run tests
        run: bundle exec rake
