name: Test

permissions:
  contents: read

on:
  # Only the default branch on push (post-merge); PR branches are covered by
  # pull_request below. Without this, a push to a branch with an open PR runs
  # the suite twice (once for push, once for pull_request).
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ruby:4.0-slim

    steps:
      - uses: actions/checkout@v4

      # git matches Dockerfile.runner: the ChangeStore tests drive a real
      # repository (init, commit, .git/info/exclude) rather than a stub, because
      # what they assert — that an excluded spec tree can't be swept into an
      # unrelated commit — is git's behaviour, not ours. ruby:4.0-slim ships
      # without it, so the suite passed locally and failed here.
      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends build-essential git

      - name: Install gems
        run: bundle install

      - name: Run tests
        run: bundle exec rake

  test-harness-js:
    # The container-side JS has no Ruby coverage; these are its only tests.
    # Node version matches Dockerfile.harness — pi-guards.ts is imported
    # directly (it carries no type annotations), so that has to keep working on
    # the same runtime the harness image ships.
    runs-on: ubuntu-latest
    container:
      image: node:22-slim

    steps:
      - uses: actions/checkout@v4

      # Globbed rather than one step per file: a new test/js/*_test.js is picked
      # up on its own, instead of running only if someone remembers to add a step
      # for it here. The shell runs with -e, so the first failure stops the job.
      - name: Run harness JS tests
        run: |
          for f in test/js/*_test.js; do
            echo "== $f"
            node "$f"
          done
