name: Test

on:
  # Only the default branch on push (post-merge); PR branches are covered by
  # pull_request below. Without this, a push to a branch with an open PR runs
  # the suite twice (once for push, once for pull_request).
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ruby:4.0-slim

    steps:
      - uses: actions/checkout@v4

      # git matches Dockerfile.runner: the ChangeStore tests drive a real
      # repository (init, commit, .git/info/exclude) rather than a stub, because
      # what they assert — that an excluded spec tree can't be swept into an
      # unrelated commit — is git's behaviour, not ours. ruby:4.0-slim ships
      # without it, so the suite passed locally and failed here.
      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends build-essential git

      - name: Install gems
        run: bundle install

      - name: Run tests
        run: bundle exec rake

  test-harness-js:
    # server.js's pi -> chomper translation (harness.rb's counterpart) has no
    # Ruby coverage; this is its only test. Node version matches Dockerfile.harness.
    runs-on: ubuntu-latest
    container:
      image: node:22-slim

    steps:
      - uses: actions/checkout@v4
      - name: Run translate() tests
        run: node test/js/translate_test.js
