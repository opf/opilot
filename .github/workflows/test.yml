name: Test

on:
  # Only the default branch on push (post-merge); PR branches are covered by
  # pull_request below. Without this, a push to a branch with an open PR runs
  # the suite twice (once for push, once for pull_request).
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ruby:4.0-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends build-essential

      - name: Install gems
        run: bundle install

      - name: Run tests
        run: bundle exec rake
