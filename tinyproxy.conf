# Egress allowlist proxy for the claude container. Only domains matching
# tinyproxy-filter are reachable (FilterDefaultDeny), and only over CONNECT
# to 443 — everything else a compromised/injected Claude session might try
# to reach is refused.
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 32
LogLevel Notice

# Docker networks only.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# HTTPS only.
ConnectPort 443

# Domain allowlist (extended regexes matched against the host).
FilterType ere
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
